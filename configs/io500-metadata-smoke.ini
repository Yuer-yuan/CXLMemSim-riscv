# Fast fixed-work pilot for IO500's shared-directory metadata path. This is not
# a score run: tiny retains broad semantic coverage, while this profile runs
# the prerequisite hard create, hard stat primary, and hard read protected
# phase. Each rank completes exactly 32 files, so pilot work is independent of
# host scheduling and a weak candidate can be rejected before broader QEMU runs.
[global]
datadir = /badfs/io500-metadata-smoke
timestamp-datadir = FALSE
resultdir = /results/metadata-smoke
timestamp-resultdir = FALSE
api = POSIX
drop-caches = FALSE
verbosity = 1
scc = TRUE
dataPacketType = timestamp

[debug]
stonewall-time = 30
pause-dir =

[ior-easy]
run = FALSE

[ior-easy-write]
run = FALSE

[ior-rnd4K]
run = FALSE

[ior-rnd4K-write]
run = FALSE

[mdtest-easy]
run = FALSE

[mdtest-easy-write]
run = FALSE

[ior-rnd1MB]
run = FALSE

[ior-rnd1MB-write]
run = FALSE

[mdworkbench]
run = FALSE

[mdworkbench-create]
run = FALSE

[find-easy]
run = FALSE

[ior-hard]
run = FALSE

[ior-hard-write]
run = FALSE

[mdtest-hard]
API = POSIX
n = 32
files-per-dir = 32
run = TRUE

[mdtest-hard-write]
API = POSIX
run = TRUE

[find]
run = FALSE

[ior-rnd4K-read]
run = FALSE

[ior-rnd1MB-read]
run = FALSE

[find-hard]
run = FALSE

[mdworkbench-bench]
run = FALSE

[ior-easy-read]
run = FALSE

[mdtest-easy-stat]
run = FALSE

[ior-hard-read]
run = FALSE

[mdtest-hard-stat]
API = POSIX
run = TRUE

[mdworkbench-delete]
run = FALSE

[mdtest-easy-delete]
run = FALSE

[mdtest-hard-read]
API = POSIX
run = TRUE

[mdtest-hard-delete]
run = FALSE

[ior-rnd4K-easy-read]
run = FALSE
