# Fixed-work diagnostic for IO500 metadata and find paths. This is not a score
# run. Easy and hard each use exactly 128 files per rank; the normal IO500
# create/stat/read/delete ordering and the shared-directory 3901-byte shape are
# unchanged.
[global]
datadir = /badfs/io500-metadata-smoke
timestamp-datadir = FALSE
resultdir = /results/metadata-smoke
timestamp-resultdir = FALSE
api = POSIX
drop-caches = FALSE
verbosity = 1
scc = TRUE
dataPacketType = timestamp

[debug]
stonewall-time = 30
pause-dir =

[ior-easy]
run = FALSE

[ior-easy-write]
run = FALSE

[ior-rnd4K]
run = FALSE

[ior-rnd4K-write]
run = FALSE

[mdtest-easy]
API = POSIX
n = 128
run = TRUE

[mdtest-easy-write]
API = POSIX
run = TRUE

[ior-rnd1MB]
run = FALSE

[ior-rnd1MB-write]
run = FALSE

[mdworkbench]
run = FALSE

[mdworkbench-create]
run = FALSE

[find-easy]
run = FALSE

[ior-hard]
run = FALSE

[ior-hard-write]
run = FALSE

[mdtest-hard]
API = POSIX
n = 128
run = TRUE

[mdtest-hard-write]
API = POSIX
run = TRUE

[find]
run = TRUE

[ior-rnd4K-read]
run = FALSE

[ior-rnd1MB-read]
run = FALSE

[find-hard]
run = FALSE

[mdworkbench-bench]
run = FALSE

[ior-easy-read]
run = FALSE

[mdtest-easy-stat]
API = POSIX
run = TRUE

[ior-hard-read]
run = FALSE

[mdtest-hard-stat]
API = POSIX
run = TRUE

[mdworkbench-delete]
run = FALSE

[mdtest-easy-delete]
API = POSIX
run = TRUE

[mdtest-hard-read]
API = POSIX
run = TRUE

[mdtest-hard-delete]
API = POSIX
run = TRUE

[ior-rnd4K-easy-read]
run = FALSE
