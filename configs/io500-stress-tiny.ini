# Fixed-work 10c pressure diagnostic, intentionally INVALID, never a score.
# Cross the real 4 MiB writer budget with 5 MiB/rank; retain shared writes,
# metadata and 12 fixed-work phases. Results live on LegoFS, as in standard.
# IOR requires a positive deadline with IO500's wear-out setting. Place it
# beyond the independent 600 s phase gate, so it cannot truncate a passing run.
[global]
datadir = /badfs/io500-stress-tiny
timestamp-datadir = FALSE
resultdir = /badfs/io500-stress-tiny-results
timestamp-resultdir = FALSE
api = POSIX
drop-caches = FALSE
verbosity = 1
scc = TRUE
dataPacketType = timestamp

[debug]
stonewall-time = 601
pause-dir =

[ior-easy]
API = POSIX
transferSize = 1m
blockSize = 5m
filePerProc = TRUE
uniqueDir = FALSE
run = TRUE

[ior-easy-write]
API = POSIX
run = TRUE

[ior-rnd4K]
run = FALSE

[ior-rnd4K-write]
run = FALSE

[mdtest-easy]
API = POSIX
# Create + terminal records cross the real 64-record apply credit.
n = 64
run = TRUE

[mdtest-easy-write]
API = POSIX
run = TRUE

[ior-rnd1MB]
run = FALSE

[ior-rnd1MB-write]
run = FALSE

[mdworkbench]
run = FALSE

[mdworkbench-create]
run = FALSE

[find-easy]
run = FALSE

[ior-hard]
API = POSIX
# 65 shared-write jobs cross the real 64-job credit as well as leave a tail.
segmentCount = 65
run = TRUE

[ior-hard-write]
API = POSIX
run = TRUE

[mdtest-hard]
API = POSIX
# Cross 64 jobs and leave a non-full tail; include the official *01* candidate.
n = 102
files-per-dir = 102
run = TRUE

[mdtest-hard-write]
API = POSIX
run = TRUE

[find]
run = TRUE

[ior-rnd4K-read]
run = FALSE

[ior-rnd1MB-read]
run = FALSE

[find-hard]
run = FALSE

[mdworkbench-bench]
run = FALSE

[ior-easy-read]
API = POSIX
run = TRUE

[mdtest-easy-stat]
API = POSIX
run = TRUE

[ior-hard-read]
API = POSIX
run = TRUE

[mdtest-hard-stat]
API = POSIX
run = TRUE

[mdworkbench-delete]
run = FALSE

[mdtest-easy-delete]
API = POSIX
run = TRUE

[mdtest-hard-read]
API = POSIX
run = TRUE

[mdtest-hard-delete]
API = POSIX
run = TRUE

[ior-rnd4K-easy-read]
# Official IO500 hardcodes ten million iterations here and relies on a short
# stonewall. Keep it in tiny/rnd4k/standard, not this fixed-work diagnostic.
run = FALSE
