# Standard IO500 defaults with the required 300-second stonewall.  Data and
# result metadata share the LegoFS clock domain; rank 0 exports verifier inputs.
[global]
datadir = /badfs/io500-standard
timestamp-datadir = FALSE
resultdir = /badfs/io500-standard-results
timestamp-resultdir = FALSE
api = POSIX
drop-caches = FALSE
verbosity = 1
scc = FALSE
dataPacketType = timestamp

[debug]
stonewall-time = 300
pause-dir =
