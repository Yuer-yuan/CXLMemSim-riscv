# Fixed-work close/receipt/arena diagnostic, intentionally INVALID and never a score.
# 128 files per rank crosses the standard 64-slot arena and writer cohort bounds.
[global]
datadir = /badfs/io500-small-close-smoke
timestamp-datadir = FALSE
resultdir = /results/small-close-smoke
