# One-second semantic smoke.  Its [INVALID] status is expected and is never a
# score submission.  Hard mdtest deliberately completes 102 files per rank:
# IO500's fixed find predicate selects `*01*`, so a stonewall-only run on a
# slow functional model can otherwise contain no eligible file even when all
# filesystem semantics are correct.
[global]
datadir = /badfs/io500-tiny
timestamp-datadir = FALSE
resultdir = /results/tiny
timestamp-resultdir = FALSE
api = POSIX
drop-caches = FALSE
verbosity = 1
scc = TRUE
dataPacketType = timestamp

[debug]
stonewall-time = 1
pause-dir =

[ior-easy]
API = POSIX
transferSize = 1m
blockSize = 64m
filePerProc = TRUE
uniqueDir = FALSE
run = TRUE

[ior-easy-write]
API = POSIX
run = TRUE

[ior-rnd4K]
run = FALSE

[ior-rnd4K-write]
run = FALSE

[mdtest-easy]
API = POSIX
n = 64
run = TRUE

[mdtest-easy-write]
API = POSIX
run = TRUE

[ior-rnd1MB]
run = FALSE

[ior-rnd1MB-write]
run = FALSE

[mdworkbench]
run = FALSE

[mdworkbench-create]
run = FALSE

[find-easy]
run = FALSE

[ior-hard]
API = POSIX
segmentCount = 256
run = TRUE

[ior-hard-write]
API = POSIX
run = TRUE

[mdtest-hard]
API = POSIX
n = 102
# IO500 disables mdtest's time stonewall when this supported diagnostic option
# is present.  That makes the tiny find gate deterministic without injecting a
# synthetic file or weakening the official `*01* -size 3901c -newer` query.
files-per-dir = 102
run = TRUE

[mdtest-hard-write]
API = POSIX
run = TRUE

[find]
run = TRUE

[ior-rnd4K-read]
run = FALSE

[ior-rnd1MB-read]
run = FALSE

[find-hard]
run = FALSE

[mdworkbench-bench]
run = FALSE

[ior-easy-read]
API = POSIX
run = TRUE

[mdtest-easy-stat]
API = POSIX
run = TRUE

[ior-hard-read]
API = POSIX
run = TRUE

[mdtest-hard-stat]
API = POSIX
run = TRUE

[mdworkbench-delete]
run = FALSE

[mdtest-easy-delete]
API = POSIX
run = TRUE

[mdtest-hard-read]
API = POSIX
run = TRUE

[mdtest-hard-delete]
API = POSIX
run = TRUE

[ior-rnd4K-easy-read]
run = TRUE
