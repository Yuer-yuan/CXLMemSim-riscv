# Low-byte 10C1S pressure: all22 phases, diagnostic only, not a submission.
# Exercise 64-job credit and tail cohorts without forcing 4MiB clean batches.
[global]
datadir = /badfs/io500-pressure22
timestamp-datadir = FALSE
resultdir = /badfs/io500-pressure22-results
timestamp-resultdir = FALSE
api = POSIX
drop-caches = FALSE
verbosity = 1
scc = TRUE
dataPacketType = timestamp

[debug]
stonewall-time = 1
pause-dir =

[ior-easy]
API = POSIX
transferSize = 4k
blockSize = 260k
filePerProc = TRUE
uniqueDir = FALSE
run = TRUE

[ior-easy-write]
# Exactly 65 small writes per rank: one 64-job credit window plus a tail.
legofs-fixed-work = TRUE
API = POSIX
run = TRUE

[ior-rnd4K]
API = POSIX
blockSize = 1048576
run = TRUE
randomPrefill = 0

[ior-rnd4K-write]
API = POSIX
run = TRUE

[mdtest-easy]
API = POSIX
n = 102
run = TRUE

[mdtest-easy-write]
# Opt-in pinned-IO500 diagnostic: complete n, retain the official find selector.
legofs-fixed-work = TRUE
API = POSIX
run = TRUE

[ior-rnd1MB]
API = POSIX
# Seed 11 needs four transfers/block to give every musl 10C rank work.
# A zero-offset rank cannot finish IOR's stonewall wear-out catch-up loop.
blockSize = 4194304
run = TRUE
randomPrefill = 0

[ior-rnd1MB-write]
API = POSIX
run = TRUE

[mdworkbench]
API = POSIX
waitingTime = 0.0
precreatePerSet = 1
filesPerProc = 1
run = TRUE

[mdworkbench-create]
run = TRUE

[find-easy]
nproc = 10
run = TRUE
pfind-queue-length = 10000
pfind-steal-next = FALSE
pfind-parallelize-single-dir-access-using-hashing = FALSE

[ior-hard]
API = POSIX
segmentCount = 2
run = TRUE

[ior-hard-write]
API = POSIX
run = TRUE

[mdtest-hard]
API = POSIX
n = 102
# This supported IO500 option makes hard creation fixed-work, so stonewall
# cannot truncate away the required .101 candidate.
files-per-dir = 102
run = TRUE

[mdtest-hard-write]
API = POSIX
run = TRUE

[find]
nproc = 10
run = TRUE
pfind-queue-length = 10000
pfind-steal-next = FALSE
pfind-parallelize-single-dir-access-using-hashing = FALSE

[ior-rnd4K-read]
API = POSIX
run = TRUE

[ior-rnd1MB-read]
API = POSIX
run = TRUE

[find-hard]
nproc = 10
run = TRUE
pfind-queue-length = 10000
pfind-steal-next = FALSE
pfind-parallelize-single-dir-access-using-hashing = FALSE

[mdworkbench-bench]
run = TRUE

[ior-easy-read]
API = POSIX
run = TRUE

[mdtest-easy-stat]
API = POSIX
run = TRUE

[ior-hard-read]
API = POSIX
run = TRUE

[mdtest-hard-stat]
API = POSIX
run = TRUE

[mdworkbench-delete]
run = TRUE

[mdtest-easy-delete]
API = POSIX
run = TRUE

[mdtest-hard-read]
API = POSIX
run = TRUE

[mdtest-hard-delete]
API = POSIX
run = TRUE

[ior-rnd4K-easy-read]
API = POSIX
run = TRUE
