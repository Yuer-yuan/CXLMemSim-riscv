# Fixed-work 2c lane-capacity diagnostic, intentionally INVALID, never a score.
# 1024 hard files/rank exceeds the current 906-inode/1812-record lane grant.
# The host requires observed bounded rollover completion, not just this size.
[global]
datadir = /badfs/io500-rollover-smoke
timestamp-datadir = FALSE
resultdir = /results/rollover-smoke
timestamp-resultdir = FALSE
api = POSIX
drop-caches = FALSE
verbosity = 1
scc = TRUE
dataPacketType = timestamp

[debug]
# Positive diagnostic deadline beyond the unchanged host 600 s phase gate.
stonewall-time = 601
pause-dir =

