# Targeted semantic smoke for the shared-file IOR path.  This is deliberately
# not a score run: it isolates interleaved 47008-byte writes and cross-client
# reads while retaining IO500's verifier data.
[global]
datadir = /badfs/io500-hard-smoke
timestamp-datadir = FALSE
resultdir = /results/hard-smoke
timestamp-resultdir = FALSE
api = POSIX
drop-caches = FALSE
verbosity = 1
scc = TRUE
dataPacketType = timestamp

[debug]
# Keep the diagnostic workload fixed at all 16 records per rank.  A one-second
# stonewall stopped ranks after different record counts, so phase time and
# transport changes were not directly comparable.
stonewall-time = 30
pause-dir =

[ior-easy]
run = FALSE

[ior-easy-write]
run = FALSE

[ior-rnd4K]
run = FALSE

[ior-rnd4K-write]
run = FALSE

[mdtest-easy]
