# Targeted IO500 diagnostic: generate the official easy files, then execute
# only the cross-client random-4K read phase. This is not a score run.
[global]
datadir = /badfs/io500-rnd4k
timestamp-datadir = FALSE
resultdir = /results/rnd4k
timestamp-resultdir = FALSE
api = POSIX
drop-caches = FALSE
verbosity = 1
scc = TRUE
dataPacketType = timestamp

[debug]
stonewall-time = 30
pause-dir =

[ior-easy]
API = POSIX
transferSize = 2m
blockSize = 9920000m
filePerProc = TRUE
uniqueDir = FALSE
run = TRUE

[ior-easy-write]
API = POSIX
run = TRUE

[ior-rnd4K]
run = FALSE

[ior-rnd4K-write]
run = FALSE

[mdtest-easy]
run = FALSE

[mdtest-easy-write]
run = FALSE

[ior-rnd1MB]
run = FALSE

[ior-rnd1MB-write]
run = FALSE

[mdworkbench]
run = FALSE

[mdworkbench-create]
run = FALSE

[find-easy]
run = FALSE

[ior-hard]
run = FALSE

[ior-hard-write]
run = FALSE

[mdtest-hard]
run = FALSE

[mdtest-hard-write]
run = FALSE

[find]
run = FALSE

[ior-rnd4K-read]
run = FALSE

[ior-rnd1MB-read]
run = FALSE

[find-hard]
run = FALSE

[mdworkbench-bench]
run = FALSE

[ior-easy-read]
run = FALSE

[mdtest-easy-stat]
run = FALSE

[ior-hard-read]
run = FALSE

[mdtest-hard-stat]
run = FALSE

[mdworkbench-delete]
run = FALSE

[mdtest-easy-delete]
run = FALSE

[mdtest-hard-read]
run = FALSE

[mdtest-hard-delete]
run = FALSE

[ior-rnd4K-easy-read]
run = TRUE
