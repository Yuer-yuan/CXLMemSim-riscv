# Fixed-work diagnostic for IO500's file-per-process sequential path. This is
# not a score run; every rank completes the same 64 MiB file without stonewall
# truncation, so before/after samples have identical work.
[global]
datadir = /badfs/io500-easy-smoke
timestamp-datadir = FALSE
resultdir = /results/easy-smoke
timestamp-resultdir = FALSE
api = POSIX
drop-caches = FALSE
verbosity = 1
scc = TRUE
dataPacketType = timestamp

[debug]
stonewall-time = 30
pause-dir =

[ior-easy]
API = POSIX
transferSize = 1m
blockSize = 64m
filePerProc = TRUE
uniqueDir = FALSE
run = TRUE

[ior-easy-write]
API = POSIX
run = TRUE

[ior-rnd4K]
run = FALSE

[ior-rnd4K-write]
run = FALSE

[mdtest-easy]
run = FALSE

[mdtest-easy-write]
run = FALSE

[ior-rnd1MB]
run = FALSE

[ior-rnd1MB-write]
run = FALSE

[mdworkbench]
run = FALSE

[mdworkbench-create]
run = FALSE

[find-easy]
run = FALSE

[ior-hard]
run = FALSE

[ior-hard-write]
run = FALSE

[mdtest-hard]
run = FALSE

[mdtest-hard-write]
run = FALSE

[find]
run = FALSE

[ior-rnd4K-read]
run = FALSE

[ior-rnd1MB-read]
run = FALSE

[find-hard]
run = FALSE

[mdworkbench-bench]
run = FALSE

[ior-easy-read]
API = POSIX
run = TRUE

[mdtest-easy-stat]
run = FALSE

[ior-hard-read]
run = FALSE

[mdtest-hard-stat]
run = FALSE

[mdworkbench-delete]
